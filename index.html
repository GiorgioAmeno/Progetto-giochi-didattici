<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16324f"><title>Giochi didattici</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script defer src="app.js"></script></head><body><main class="shell"><header class="brand"><div class="mark">G</div><div><h1>Giochi didattici</h1><p>Accedi per svolgere l'esercizio assegnato.</p></div></header><section class="panel"><h2>Accesso studente</h2><form id="login-form"><label for="fullName">Nome e cognome</label><input id="fullName" autocomplete="name" required maxlength="120" placeholder="Es. Mario Rossi"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><label for="gameCode">Codice gioco</label><input id="gameCode" required maxlength="30" placeholder="Es. MEM01"><button id="login-button">Entra nel gioco</button><p id="message" role="status" aria-live="polite"></p></form></section><footer>Usa le credenziali fornite dall'insegnante. Non condividere la password.</footer></main></body></html>
